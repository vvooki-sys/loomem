[package]
name = "loomem-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# Original unit tests remain in the server binary with its HTTP router fixture.
test = false

[[bin]]
name = "loomem-server"
path = "src/main.rs"

[[bin]]
name = "hosted_shared_engine"
path = "src/bin/hosted_shared_engine.rs"
required-features = ["hosted-engine"]

[dependencies]

loomem-core = { path = "../loomem-core", features = ["onnx-rerank"] }

reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
subtle.workspace = true
chrono.workspace = true
uuid.workspace = true

# System utilities
num_cpus = "1.16"
futures = "0.3"
regex = "1"
libc = "0.2"

# Embedded dashboard SPA (see workspace Cargo.toml for rationale)
rust-embed.workspace = true


[features]
evaluation = ["loomem-core/evaluation"]
default = ["onnx-rerank"]
onnx-rerank = []
hosted-engine = []

[dev-dependencies]
tempfile = "3.8"
