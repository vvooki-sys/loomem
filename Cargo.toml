[workspace]
resolver = "2"
members = [
    "loomem-core",
    "loomem-server",
    "loomem-migrate",
    "loomem-cli",
]
# Evidence tool with its own lockfile: the one place `bincode` may still
# appear, kept out of the engine's dependency graph and audit on purpose.
exclude = ["tools/legacy-fixture-gen"]

[workspace.package]
version = "0.5.4"
edition = "2021"
rust-version = "1.93.1"
authors = ["Łukasz Gumowski <lukasz.gumowski@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Storage
rocksdb = { version = "0.24", default-features = false, features = ["snappy", "lz4"] }
# tantivy 0.25.0 exactly as released, plus two dependency bumps: `lru`
# (0.12 -> 0.18.2, clears RUSTSEC-2026-0002 / RUSTSEC-2026-0253) and `zstd`
# (0.13 -> 0.14, upstream #3085 cherry-picked, clears RUSTSEC-2026-0391 et al.
# via zstd-safe 8.2 / zstd-sys 2.1.2). Every crates.io tantivy release (0.25.x,
# 0.26.x) still pins lru <0.18, so the patched revision lives in our fork;
# `rev` is immutable and matches tag 0.25.0-loomem.2. Drop back to crates.io
# once a release ships lru >= 0.18.2 and zstd >= 0.14.
tantivy = { git = "https://github.com/vvooki-sys/tantivy", rev = "5b13a59416a96ca1a93dc166b289118a30d7a46d" }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
# Embedded dashboard SPA (loomem-dashboard/dist compiled into the binary —
# ships one self-contained file to every instance). Chosen over ServeDir
# (would require deploying a directory next to the binary) and include_str!
# (doesn't scale to Vite's hashed asset names). cargo-audit clean, actively
# maintained, no default extra features.
rust-embed = "8"

# Security primitives (audit 2026-07-01): constant-time token comparison
# (item 4) + key-material zeroization on drop (item 5). Both were already in
# the dependency tree transitively via the crypto stack; pinned here to use
# them directly instead of hand-rolling the primitives.
subtle = "2.6"
zeroize = "1.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
unicode-normalization = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
futures = "0.3"

[workspace.lints.clippy]
# too_many_arguments: all violations are pipeline/constructor signatures deferred to /06d struct refactor
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

