name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly audit of main, so new RUSTSEC advisories surface without a change.
  schedule:
    - cron: '23 5 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      rust: ${{ steps.scope.outputs.rust }}
      audit: ${{ steps.scope.outputs.audit }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      website: ${{ steps.scope.outputs.website }}
      bench: ${{ steps.scope.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test scope rules
        run: node scripts/test-ci-scope.cjs
      - name: Classify changes
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_EVENT: ${{ github.event_name }}
        run: node scripts/ci-scope.cjs

  check:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Check + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (lib only, no integration)
        run: cargo test --workspace --lib

  clippy:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      # The evaluation feature compiles extra server/core code that the
      # default gate never sees; keep it warning-free too.
      - name: cargo clippy (evaluation feature)
        run: cargo clippy -p loomem-server --features evaluation -- -D warnings

  fmt:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  dashboard:
    needs: scope
    if: needs.scope.outputs.dashboard == 'true'
    name: Dashboard (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loomem-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Node (22, npm 10) as release.yml, so a lockfile that npm 10
      # cannot resolve fails here instead of in the release build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loomem-dashboard/package-lock.json
      - name: npm ci
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npm test
      - name: vite build
        run: npm run build

  website:
    needs: scope
    if: needs.scope.outputs.website == 'true'
    name: Website language selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test language selection
        run: node scripts/test-site-locale.cjs
      - name: Browser language switching and persistence
        run: bash scripts/test-site-browser.sh

  bench:
    needs: scope
    if: needs.scope.outputs.bench == 'true'
    name: Bench harness (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install tiktoken
        run: python -m pip install tiktoken==0.12.0
      # The o200k encoding is the only download; tests use synthetic data,
      # no API keys and no other network.
      - name: Cache o200k encoding
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tiktoken
          key: tiktoken-0.12.0-o200k_base
      - name: Load o200k encoding
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
      - name: unittest bench/longmemeval
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: python -m unittest discover -s bench/longmemeval -p 'test_*.py'

  audit:
    needs: scope
    if: needs.scope.outputs.audit == 'true'
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      # Prebuilt, checksum-verified binary instead of compiling it each run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit --deny warnings

  gate:
    name: CI gate
    if: always()
    needs: [scope, check, clippy, fmt, dashboard, website, bench, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails unless every selected job succeeded and every other job was
      # skipped. Check, Clippy and Format all report under "rust".
      - name: Verify expected jobs and report scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE: ${{ needs.scope.outputs.scope }}
          SELECT_RUST: ${{ needs.scope.outputs.rust }}
          SELECT_AUDIT: ${{ needs.scope.outputs.audit }}
          SELECT_DASHBOARD: ${{ needs.scope.outputs.dashboard }}
          SELECT_WEBSITE: ${{ needs.scope.outputs.website }}
          SELECT_BENCH: ${{ needs.scope.outputs.bench }}
          RESULT_RUST: ${{ needs.check.result == needs.clippy.result && needs.check.result == needs.fmt.result && needs.check.result || 'mixed' }}
          RESULT_AUDIT: ${{ needs.audit.result }}
          RESULT_DASHBOARD: ${{ needs.dashboard.result }}
          RESULT_WEBSITE: ${{ needs.website.result }}
          RESULT_BENCH: ${{ needs.bench.result }}
        run: node scripts/ci-scope.cjs --gate
