[package]
name = "legacy-fixture-gen"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
publish = false
description = "Evidence tool: writes the bincode-1 golden fixtures consumed by loomem-core's persisted_codec tests"

# Deliberately its own root: this tool is the only place `bincode` is still
# allowed to appear, and it must never enter the engine workspace lockfile or
# its audit. The root Cargo.toml lists this directory under `exclude`.
[workspace]

[dependencies]
loomem-core = { path = "../../loomem-core", default-features = false }
# The reference encoder. Pinned to the exact version the engine used before
# `persisted_codec` replaced it; the fixtures document what *it* wrote.
bincode = "=1.3.3"
serde_json = "1.0"
anyhow = "1.0"
